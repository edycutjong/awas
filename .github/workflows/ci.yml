name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full matrix on main, one Node on PRs.
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # No credentials in CI: the suite uses recorded fixtures and fake upstreams, never the product's keys.
      - run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production, high and critical)
        run: npm run audit

  secrets:
    name: Secret scan (pushed commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    name: Production build
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Static bundle size
        run: |
          size=$(du -sk .next/static | cut -f1)
          echo "Static assets: ${size} KB"
          if [ "$size" -gt 2000 ]; then echo "::error::static bundle ${size} KB is over the 2000 KB budget"; exit 1; fi
          if [ "$size" -gt 1500 ]; then echo "::warning::static bundle ${size} KB is over 1500 KB"; fi

  e2e:
    name: Browser tests (390 px and 1280 px)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # No keys and no bucket: the app runs on its local store, and only credential-free paths are asserted.
      - run: npm run e2e
        env:
          CI: "true"
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (advisory)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.x autorun

  gate:
    name: All gates
    needs: [quality, security, secrets, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint, types, tests, audit, secrets, build and browser tests passed"
