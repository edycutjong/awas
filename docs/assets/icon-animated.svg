<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Awas — a pencil-grey quote turns highlighter-yellow the instant code finds it verbatim in the fetched page; then STOP stamps red.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: folio plate, ruling, red margin, a proposed line in pencil, two ink quote lines — the poster
  10-25%  trigger:      a reading cursor runs across the quote lines (code checks the page)       data-story="beat-2"
  25-55%  mechanism:    A pencil-grey quote turns highlighter-yellow the instant code finds it verbatim in the fetched page; then STOP stamps red.   data-story="beat-3"
  55-80%  resolution:   the red rubber stamp lands over the clipping and stays                     data-story="beat-4"
  80-100% breathe + seam fade: the highlighter glows once (80-92%), story fades 93-98%, quiet 98-100%
-->
<defs>
  <clipPath id="ia-plate"><rect x="20" y="20" width="472" height="472" rx="104"/></clipPath>
  <clipPath id="ia-sweep"><rect x="96" y="160" width="0" height="170"><animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.45;0.96;1" values="0;0;340;340;340"/></rect></clipPath>
  <filter id="ia-blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>
  .ia-stamp { transform-box: fill-box; transform-origin: center; animation: ia-pop 6s cubic-bezier(.2,1.4,.4,1) infinite; }
  g[data-story] { }
  @keyframes ia-pop {
    0%, 55% { opacity: 0; transform: scale(1.35) rotate(4deg); }
    60% { opacity: 1; transform: scale(.94) rotate(-1deg); }
    64%, 93% { opacity: 1; transform: scale(1) rotate(0deg); }
    98%, 100% { opacity: 0; transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<!-- brand layer: visible at t=0 -->
<rect x="20" y="20" width="472" height="472" rx="104" fill="#FBFAF5" stroke="#1C2333" stroke-width="22"/>
<g clip-path="url(#ia-plate)">
  <path d="M20 118H492M20 196H492M20 274H492M20 352H492M20 430H492" stroke="#C7D5E8" stroke-width="6"/>
  <path d="M92 20V492" stroke="#E9A6A1" stroke-width="7"/>
  <!-- story: highlighter pass, revealed by the sweeping clip -->
  <g data-story="beat-3" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.249;0.25;0.93;0.98;1" values="0;0;1;1;0;0"/>
    <path clip-path="url(#ia-sweep)" d="M104 188 L424 178 L436 204 L428 302 L110 312 L98 288 Z" fill="#FFE14D"/>
  </g>
  <g data-story="beat-5" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8;0.86;0.92;1" values="0;0;0.55;0;0"/>
    <path filter="url(#ia-blur)" d="M104 188 L424 178 L436 204 L428 302 L110 312 L98 288 Z" fill="#FFE14D"/>
  </g>
  <!-- brand: the proposed line (pencil) and the quote (ink) -->
  <rect x="124" y="128" width="216" height="28" rx="14" fill="#878C95"/>
  <rect x="128" y="207" width="270" height="30" rx="15" fill="#1C2333"/>
  <rect x="128" y="257" width="196" height="30" rx="15" fill="#1C2333"/>
  <!-- story: the reading cursor -->
  <rect data-story="beat-2" x="96" y="196" width="6" height="104" rx="3" fill="#1C2333" opacity="0"><animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.25;0.96;1" values="96;96;430;430;96"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1;0.11;0.24;0.25;1" values="0;0;0.6;0.6;0;0"/></rect>
  <!-- story: the proposed line is struck — its quote was not on the page -->
  <g data-story="beat-3" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.399;0.4;0.93;0.98;1" values="0;0;1;1;0;0"/>
    <path d="M110 142H356" pathLength="100" stroke="#1C2333" stroke-width="8" stroke-linecap="butt" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4;0.5;0.96;1" values="100;100;0;0;0"/></path>
  </g>
</g>
<rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#1C2333" stroke-width="22"/>
<!-- story: the rubber stamp -->
<g data-story="beat-4" transform="rotate(-9 318 392)">
  <g class="ia-stamp" data-story="beat-4" opacity="0">
    <rect x="186" y="330" width="264" height="124" rx="22" fill="#FBFAF5" fill-opacity="0.82" stroke="#B42318" stroke-width="22"/>
    <rect x="222" y="370" width="192" height="44" rx="10" fill="#B42318"/>
  </g>
</g>
</svg>
