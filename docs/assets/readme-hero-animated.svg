<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Awas — a pencil-grey quote turns highlighter-yellow the instant code finds it verbatim in the fetched page; then STOP stamps red.">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: folio plate, mark, outlined Awas wordmark, tagline, metric line, stack line;
          right: the page text Tavily returned (pencil grey) and two proposed lines (pending) — the poster
  10-25%  trigger:      a reading cursor sweeps across the page text — code checks the quotes        data-story="beat-2"
  25-55%  mechanism:    A pencil-grey quote turns highlighter-yellow the instant code finds it verbatim in the fetched page; then STOP stamps red.   data-story="beat-3"
          (the exact matching span on the page and proposed line 1 are highlighted; line 1 turns from pencil to ink; proposed line 2 is struck, "not on the page")
  55-80%  resolution:   the STOP rubber stamp lands and stays; highlighted evidence persists to 93% (signature + residue 25-93% = 68% of the loop)   data-story="beat-4"
  80-100% breathe + seam fade: the stamp glows once (80-92%); story fades 93-98%, quiet 98-100%
-->
<defs>
  <clipPath id="rh-plate"><rect x="2" y="2" width="1276" height="316" rx="22"/></clipPath>
  <filter id="rh-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="rh-glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <linearGradient id="rh-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1C2333" stop-opacity="0"/><stop offset=".5" stop-color="#1C2333" stop-opacity="1"/><stop offset="1" stop-color="#1C2333" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .rh-blob-a { animation: rh-drift-a 15s ease-in-out infinite alternate; }
  .rh-blob-b { animation: rh-drift-b 18s ease-in-out infinite alternate; }
  @keyframes rh-drift-a { from { transform: translate(0,0); } to { transform: translate(60px,-18px); } }
  @keyframes rh-drift-b { from { transform: translate(0,0); } to { transform: translate(-70px,20px); } }
  .rh-stamp { transform-box: fill-box; transform-origin: center; animation: rh-pop 8s cubic-bezier(.2,1.4,.4,1) infinite; }
  g[data-story] { }
  @keyframes rh-pop {
    0%, 55% { opacity: 0; transform: scale(1.4) rotate(5deg); }
    59% { opacity: 1; transform: scale(.95) rotate(-1deg); }
    62%, 93% { opacity: 1; transform: scale(1) rotate(0deg); }
    98%, 100% { opacity: 0; transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
</style>

