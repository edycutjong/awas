<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Awas — a clipped quote turns highlighter-yellow once code verifies it on the page, and a red rubber stamp lands">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--accent, #FFE14D)"/>
      <stop offset="100%" stop-color="var(--accent, #FFE14D)"/>
    </linearGradient>
    <clipPath id="plate"><rect x="20" y="20" width="472" height="472" rx="104"/></clipPath>
  </defs>
  <!-- plate: folio paper with an ink edge — holds on GitHub light AND dark -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#FBFAF5" stroke="#1C2333" stroke-width="22"/>
  <g clip-path="url(#plate)">
    <!-- folio ruling + red margin: texture at 512, dissolves below 64 by design -->
    <path d="M20 118H492M20 196H492M20 274H492M20 352H492M20 430H492" stroke="#C7D5E8" stroke-width="6"/>
    <path d="M92 20V492" stroke="#E9A6A1" stroke-width="7"/>
    <!-- before: a proposed line in pencil graphite, struck through (not on the page) -->
    <rect x="124" y="128" width="216" height="28" rx="14" fill="var(--primary, #878C95)"/>
    <path d="M110 142H356" stroke="#1C2333" stroke-width="7" stroke-linecap="round"/>
    <!-- after: the verified quote — a wide highlighter pass with uneven ends, two ink lines on top -->
    <path d="M104 188 L424 178 L436 204 L428 302 L110 312 L98 288 Z" fill="url(#hl)"/>
    <rect x="128" y="207" width="270" height="30" rx="15" fill="#1C2333"/>
    <rect x="128" y="257" width="196" height="30" rx="15" fill="#1C2333"/>
  </g>
  <!-- ink ring re-drawn over the clipped contents so the ruling and margin never poke over the edge -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#1C2333" stroke-width="22"/>
  <!-- the rubber stamp: tilted double-ruled frame in stamp red, overlapping the clipping's lower edge -->
  <g transform="rotate(-9 318 392)">
    <rect x="186" y="330" width="264" height="124" rx="22" fill="#FBFAF5" fill-opacity="0.82" stroke="#B42318" stroke-width="22"/>
    <rect x="222" y="370" width="192" height="44" rx="10" fill="#B42318"/>
  </g>
</svg>
